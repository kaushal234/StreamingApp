# ---------------------------------------------------------------------------
# adminService — Deployment + ClusterIP Service.
# Same pattern as auth. Port 3003. Health endpoint is /api/health.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  labels:
    app: admin
    app.kubernetes.io/part-of: streamingapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
    spec:
      containers:
        - name: admin
          image: kaushalhub234/streaming-admin:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3003
          env:
            - name: PORT
              value: "3003"
          envFrom:
            - configMapRef:
                name: streamingapp-config
            - secretRef:
                name: streamingapp-secret
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3003
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3003
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  labels:
    app: admin
    app.kubernetes.io/part-of: streamingapp
spec:
  type: ClusterIP
  selector:
    app: admin
  ports:
    - name: http
      port: 3003
      targetPort: 3003