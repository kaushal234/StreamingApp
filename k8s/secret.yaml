apiVersion: v1
kind: Secret
metadata:
  name: streamingapp-secret
  labels:
    app.kubernetes.io/part-of: streamingapp
type: Opaque
# stringData lets us write plain text; Kubernetes base64-encodes it on apply.
# Much easier to read and edit than pre-encoded data:.
stringData:
  # Shared across ALL services so a JWT issued by auth verifies everywhere.
  # Any non-empty string works locally; keep it identical for every service.
  JWT_SECRET: "localdevsecret-change-me"

  # Left blank until we create the S3 bucket + IAM user (upload/playback tests).
  # With these empty, register/login/chat all work; only S3 calls are disabled.
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""